name: SYNC ROSTRA TESTING
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run workflow against'
        type: choice
        required: true
        options:
          - DEV
          - PROD2
          - PROD
  push:
    branches:
      - configure

env:
  DBT_PROFILES_DIR: ./profiles

jobs:
  configure:
    name: configure
    runs-on: ubuntu-latest
    steps:
      - name: Set Runner Label
        id: set_runner
        run: |
          if [[ "${{ github.event.inputs.environment }}" == "DEV" ]]; then
            echo "runner_label=windows-latest" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.environment }}" == "PROD2" ]]; then
            echo "runner_label=ubuntu-latest" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.environment }}" == "PROD" ]]; then
            echo "runner_label=ubuntu-latest" >> $GITHUB_OUTPUT
          fi
    outputs:
      runner_label: ${{ steps.set_runner.outputs.runner_label }}
          
  dbt-dev-deployment:
    name: dbt dev Deployment
    needs: [configure]
    runs-on: ${{ needs.configure.outputs.runner_label }}
    strategy:
      matrix:
        environment: [DEV, PROD2, PROD]
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v2

      - name: Configure Deploy Environment
        run: |

          if ${{ github.ref  == 'refs/heads/main'}}; then
            echo "rostra_deployment_stage=${{ matrix.environment }}" >> $GITHUB_ENV;
          elif ${{ github.event.inputs.environment != '' }}; then
            echo "rostra_deployment_stage=${{github.event.inputs.environment}}" >> $GITHUB_ENV;
          else
            echo "Unknown Stage/Branch"
          fi

      # - name: print env
      #   run : ${{ env.rostra_deployment_stage }}

      - name: setting env variables
        run: |
            echo "SNOWFLAKE_ACCOUNT=${{ secrets[format('{0}_SNOWFLAKE_ACCOUNT', env.rostra_deployment_stage)] }}" >> $GITHUB_ENV;


      - name: Running python file
        run: |
          python3 test.py



